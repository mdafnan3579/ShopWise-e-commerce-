# Local development infrastructure.
#
#   docker compose up -d mongo     # just the database (run the API with `npm run dev`)
#   docker compose --profile app up --build   # database + API container
#
# MongoDB runs as a single-node replica set because multi-document transactions
# (used by the Stripe webhook) are only available on replica sets.
services:
  mongo:
    image: mongo:8
    container_name: shopwise-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then simply reports its status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  api:
    profiles: ['app']
    build: .
    container_name: shopwise-api
    env_file: .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/shopwise?directConnection=true
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
