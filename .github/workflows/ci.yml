name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - lint, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shopwise-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: shopwise-api/.nvmrc
          cache: npm
          cache-dependency-path: shopwise-api/package-lock.json

      - run: npm ci

      # mongodb-memory-server downloads a mongod binary on first use; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('shopwise-api/package-lock.json') }}

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test with coverage (fails under the thresholds in vitest.config.js)
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  api-docker:
    name: API - Docker build
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag shopwise-api:ci shopwise-api

  web:
    name: Web - lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shopwise-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: shopwise-api/.nvmrc
          cache: npm
          cache-dependency-path: shopwise-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
